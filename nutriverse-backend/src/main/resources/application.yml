server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: nutriverse-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:nutriversedb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/nutriverse_catalog}

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:demo-key-nutriverse}
      chat:
        options:
          model: gpt-4o
          temperature: 0.2

# Application Configuration Tokens
nutriverse:
  security:
    jwt:
      secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      expiration-ms: 86400000 # 24 Hours
  ai:
    vector-store:
      distance-type: COSINE
      dimensions: 1536

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
